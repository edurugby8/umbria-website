# Publica UMBRÍA en GitHub Pages en cada empujón a `main`.
#
# Requiere UNA vez, a mano: Settings → Pages → Source: «GitHub Actions».
# A partir de ahí, este flujo compila y publica solo.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

# Los permisos mínimos para que la acción de despliegue pueda publicar
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. No se cancela el que esté en curso: interrumpir una
# publicación a medias deja la página en un estado raro.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` en vez de `npm install`: instala exactamente lo que dice el
      # archivo de bloqueo, así lo que se publica es lo que se probó.
      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: Publicar
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
