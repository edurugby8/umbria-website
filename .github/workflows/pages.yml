# Publica UMBRÍA en GitHub Pages en cada empujón a `main`.
#
# El flujo se encarga de todo, incluido habilitar Pages la primera vez
# (`enablement: true` más abajo). No hay que tocar nada a mano.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

# Los permisos mínimos para que la acción de despliegue pueda publicar
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. No se cancela el que esté en curso: interrumpir una
# publicación a medias deja la página en un estado raro.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` en vez de `npm install`: instala exactamente lo que dice el
      # archivo de bloqueo, así lo que se publica es lo que se probó.
      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      # `enablement: true` habilita Pages en el repositorio la primera vez, en
      # lugar de fallar pidiendo que se active a mano. Es lo que necesita el
      # permiso `pages: write` declarado arriba.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: Publicar
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
